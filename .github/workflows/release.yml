name: Release

on:
  push:
    branches:
      - main
      - tauri-desktop
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality Gate (Lint & Build Verification)
        run: |
          echo "Checking ESLint rules..."
          bun run lint
          echo "Verifying Next.js TypeScript & Static Export build..."
          bun run build

      - name: Verify Version Sync & Check Tag
        id: check
        run: |
          bun run check:version
          VERSION=$(bun run scripts/check-versions.ts --print)
          echo "Current project version: v$VERSION"
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Tag v$VERSION already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with release for v$VERSION."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

  publish-tauri:
    name: Build & Release (${{ matrix.platform }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: 'v1-tauri-desktop'
          cache-all-crates: 'true'

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Extract Changelog for Release
        id: changelog
        run: |
          {
            echo 'body<<EOF'
            bun run scripts/check-versions.ts --changelog
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate Tauri updater signing key
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required to create signed in-app updates."
            exit 1
          }

      - name: Generate NM Actions token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: numeric-methods

      - name: Build Tauri and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: 'Numeric Methods v${{ needs.check-version.outputs.version }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Generate and publish Tauri updater manifest
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.check-version.outputs.version }}"
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS updater installer was not found in $nsisDir." }

          $signaturePath = "$($exe.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            $signatureFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "$($exe.Name).sig" -Recurse | Select-Object -First 1
            if ($signatureFile) { $signaturePath = $signatureFile.FullName }
          }
          if (-not (Test-Path $signaturePath)) { throw "Tauri signature for $($exe.Name) is missing." }

          $installerDownloadUrl = gh release view $tag --repo $repo --json assets --jq '.assets[] | select(.name | endswith("-setup.exe")) | .url' | Select-Object -First 1
          if (-not $installerDownloadUrl) { throw "Published Windows installer URL for $tag was not found." }

          bun run scripts/generate-updater-manifest.ts $version $repo $tag $exe.FullName $signaturePath $installerDownloadUrl "latest.json"
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate Tauri updater manifest." }

          gh release upload $tag $exe.FullName $signaturePath "latest.json" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload signed updater assets for $tag." }

  build-android:
    name: Build Android APK
    needs: [check-version, publish-tauri]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: 'v1-tauri-android'
          cache-all-crates: 'true'

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android Project
        run: bun run tauri:android:init

      - name: Apply Custom Android Icons & Splash Assets
        run: |
          echo "Syncing icons using Tauri CLI..."
          bun run tauri icon src-tauri/icons/icon.png || true
          if [ -d "src-tauri/icons/android" ]; then
            echo "Copying pre-rendered Android mipmaps into native project..."
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi
          echo "Verified Android res mipmap contents:"
          ls -la src-tauri/gen/android/app/src/main/res/mipmap-* || true

      - name: Build Android APKs
        run: |
          mkdir -p release_apks

          echo "Building Universal Android APK..."
          bun run tauri:android:build --apk

          UNIVERSAL_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*universal*release*.apk" -o -name "*release-unsigned.apk" | head -n 1)
          if [ -z "$UNIVERSAL_SRC" ]; then
            UNIVERSAL_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Universal APK source: $UNIVERSAL_SRC"
          cp "$UNIVERSAL_SRC" release_apks/universal_raw.apk

          echo "Building Lightweight Split (arm64) Android APK..."
          bun run tauri:android:build --apk --split-per-abi || true

          ARM64_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*arm64*release*.apk" | head -n 1)
          if [ -z "$ARM64_SRC" ]; then
            echo "arm64 split not found via --split-per-abi, compiling target aarch64 directly..."
            bun run tauri:android:build --apk --target aarch64
            ARM64_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" -newer release_apks/universal_raw.apk | head -n 1)
            if [ -z "$ARM64_SRC" ]; then
              ARM64_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
            fi
          fi
          echo "ARM64 APK source: $ARM64_SRC"
          cp "$ARM64_SRC" release_apks/arm64_raw.apk

      - name: Sign & Optimize Android APKs
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE is required. Run the Generate Android Keystore workflow and save it as a repository secret."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          KEYSTORE_PASS="${KEYSTORE_PASSWORD:-numericmethods}"
          KEY_ALIAS_VALUE="${KEY_ALIAS:-numericmethods}"
          KEY_PASS="${KEY_PASSWORD:-numericmethods}"

          for ARCH in arm64 universal; do
            RAW="release_apks/${ARCH}_raw.apk"
            ALIGNED="release_apks/${ARCH}_aligned.apk"
            FINAL="release_apks/Numeric.Methods_${VERSION}_${ARCH}.apk"

            if [ -f "$RAW" ]; then
              echo "Aligning and signing $ARCH APK..."
              $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW" "$ALIGNED"
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks release.jks \
                --ks-pass "pass:$KEYSTORE_PASS" \
                --key-pass "pass:$KEY_PASS" \
                --ks-key-alias "$KEY_ALIAS_VALUE" \
                --out "$FINAL" \
                "$ALIGNED"
              $BUILD_TOOLS_DIR/apksigner verify -v "$FINAL"
              echo "Created signed APK: $FINAL"
            fi
          done

          rm -f release_apks/*_raw.apk release_apks/*_aligned.apk release.jks

      - name: Generate NM Actions token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: numeric-methods

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "v${{ needs.check-version.outputs.version }}" release_apks/Numeric.Methods_*.apk --repo "$GITHUB_REPOSITORY" --clobber

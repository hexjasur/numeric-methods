name: Release

on:
  push:
    branches:
      - main
      - tauri-desktop
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Version Sync & Check Tag
        id: check
        run: |
          bun run check:version
          VERSION=$(bun run scripts/check-versions.ts --print)
          echo "Current project version: v$VERSION"
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Tag v$VERSION already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with release for v$VERSION."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

  publish-tauri:
    name: Build & Release (${{ matrix.platform }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Extract Changelog for Release
        id: changelog
        run: |
          {
            echo 'body<<EOF'
            bun run scripts/check-versions.ts --changelog
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: 'Numeric Methods v${{ needs.check-version.outputs.version }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

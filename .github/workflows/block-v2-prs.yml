name: Block v2 PRs

on:
  pull_request:
    types: [opened, reopened]
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-v2-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR if it comes from v2
        if: github.head_ref == 'v2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "v2 branch master'ga birlashtirilmaydi. Bu alohida loyiha. PR avtomatik yopildi."

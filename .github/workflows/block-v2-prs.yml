name: Block v2 PRs

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  block-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if PR comes from v2 branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "v2" ]; then
            echo "::error::v2 branch PR'lari master'ga birlashtirilmaydi. Bu branch alohida loyiha."
            exit 1
          fi
          echo "OK: $HEAD_REF -> master"

name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore & Base64
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias numericmethods \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass numericmethods \
            -keypass numericmethods \
            -dname "CN=NumericMethods, OU=Mobile, O=JKSoftware, L=Tashkent, C=UZ"

          BASE64_KEYSTORE=$(base64 -w 0 release.jks)

          echo "### 📱 Permanent Android Release Keystore Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy the Base64 string below and add it to GitHub Repository Secrets:" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Name:** \`ANDROID_KEYSTORE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$BASE64_KEYSTORE" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore
          path: release.jks
          retention-days: 7

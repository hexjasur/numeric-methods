  <div class="main-content" id="main-content" style="padding: 0">

      </div>

    </header>

    <div style="padding:30px; display:grid; grid-template-columns: 340px 1fr; gap:30px; margin-top:20px;">

      <div>
        <div class="cyber-card" style="padding:20px; margin-bottom:20px;">
          <label style="font-weight:bold; font-size:0.8rem; display:block; margin-bottom:8px;">FUNKSIYANI
            KIRITING:</label>
          <input type="text" id="eq" class="math-input" value="x-1-sin(x)/10" oninput="updateKaTeX()">
          <div id="katex-render"></div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div>
              <label style="font-size:0.7rem; font-family:'JetBrains Mono',monospace;">X MIN</label>
              <input type="number" id="xmin" class="math-input" value="-10" style="padding:8px;">
            </div>
            <div>
              <label style="font-size:0.7rem; font-family:'JetBrains Mono',monospace;">X MAX</label>
              <input type="number" id="xmax" class="math-input" value="10" style="padding:8px;">
            </div>
          </div>
          <button class="cyber-button" onclick="init()"
            style="width:100%; margin-top:15px; padding:12px 25px; font-size:1rem;">GRAFIKNI CHIZISH</button>
        </div>

        <div class="cyber-card" style="padding:20px;">
          <div class="success-badge">ILDIZLAR</div>
          <div id="results-list" style="font-size:0.9rem; font-family:'JetBrains Mono',monospace;">Hozircha ildizlar
            topilmadi...</div>
        </div>
      </div>

      <div>
        <div class="canvas-container" id="wrap">
          <canvas id="gc"></canvas>
        </div>
      </div>

    </div>

    <footer style="margin:20px 30px; text-align:center;">
      <div style="display:inline-block; padding:12px 40px; border-top:2px solid #000;">
        <p
          style="font-size:10px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:0.3em; font-family:'JetBrains Mono',monospace;">

  <script>
    const canvas = document.getElementById('gc');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('wrap');

    let W, H;
    let viewX = -10, viewY = -6, viewW = 20, viewH = 12;
    let fFunc = null;
    let roots = [];

    function updateKaTeX() {
      const input = document.getElementById('eq').value;
      const renderArea = document.getElementById('katex-render');
      try {
        const node = math.parse(input);
        const latex = node.toTex({ parenthesis: 'keep', implicit: 'hide' });
        katex.render("f(x) = " + latex, renderArea, { throwOnError: false });
      } catch (e) {
        renderArea.innerHTML = "<span style='color:red; font-size:0.8rem'>Xato kiritildi...</span>";
      }
    }

    function resize() {
      W = wrap.clientWidth;
      H = wrap.clientHeight;
      canvas.width = W;
      canvas.height = H;
      draw();
    }

    function toScreen(wx, wy) { return { x: (wx - viewX) / viewW * W, y: H - (wy - viewY) / viewH * H }; }
    function toWorld(sx, sy) { return { x: viewX + sx / W * viewW, y: viewY + (H - sy) / H * viewH }; }

    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      const origin = toScreen(0, 0);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      const step = niceStep(viewW / 10);

      for (let x = Math.floor(viewX / step) * step; x <= viewX + viewW; x += step) {
        let p = toScreen(x, 0);
        ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, H); ctx.stroke();
        ctx.fillStyle = "#475569"; ctx.strokeStyle = "#000"; ctx.font = "bold 11px JetBrains Mono";
        if (Math.abs(x) > 0.001) {
          ctx.beginPath(); ctx.moveTo(p.x, origin.y - 5); ctx.lineTo(p.x, origin.y + 5); ctx.stroke();
          ctx.fillText(x.toFixed(1), p.x + 2, origin.y + 18);
        }
      }

      for (let y = Math.floor(viewY / step) * step; y <= viewY + viewH; y += step) {
        let p = toScreen(0, y);
        ctx.strokeStyle = '#e2e8f0';
        ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(W, p.y); ctx.stroke();
        ctx.fillStyle = "#475569"; ctx.strokeStyle = "#000";
        if (Math.abs(y) > 0.001) {
          ctx.beginPath(); ctx.moveTo(origin.x - 5, p.y); ctx.lineTo(origin.x + 5, p.y); ctx.stroke();
          ctx.fillText(y.toFixed(1), origin.x + 8, p.y + 3);
        }
      }

      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, origin.y); ctx.lineTo(W, origin.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, H); ctx.stroke();

      if (fFunc) {
        ctx.strokeStyle = '#00f2ff'; ctx.lineWidth = 3;
        ctx.shadowBlur = 5; ctx.shadowColor = '#00f2ff';
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= W; i++) {
          let wx = viewX + (i / W) * viewW;
          try {
            let wy = fFunc(wx);
            let p = toScreen(wx, wy);
            if (p.y >= -100 && p.y <= H + 100) {
              if (!started) { ctx.moveTo(p.x, p.y); started = true; }
              else ctx.lineTo(p.x, p.y);
            } else { started = false; }
          } catch (e) { started = false; }
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      roots.forEach(r => {
        let p = toScreen(r, 0);
        ctx.fillStyle = '#ff00ea';
        ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      });
    }

    function niceStep(val) {
      let exp = Math.floor(Math.log10(val));
      let f = val / Math.pow(10, exp);
      if (f < 1.5) f = 1; else if (f < 3) f = 2; else if (f < 7) f = 5; else f = 10;
      return f * Math.pow(10, exp);
    }

    function init() {
      const expr = document.getElementById('eq').value;
      const xmin = parseFloat(document.getElementById('xmin').value);
      const xmax = parseFloat(document.getElementById('xmax').value);
      try {
        const node = math.parse(expr);
        const code = node.compile();
        fFunc = (x) => code.evaluate({ x });
        roots = [];
        const searchStep = (xmax - xmin) / 200;
        for (let x = xmin; x <= xmax; x += searchStep) {
          if (fFunc(x) * fFunc(x + searchStep) < 0) roots.push(bisect(fFunc, x, x + searchStep));
        }
        viewX = xmin; viewW = xmax - xmin; viewY = -viewW / 3; viewH = viewW * (H / W);
        renderResults(); draw();
      } catch (e) { alert("Xatolik: " + e.message); }
    }

    function bisect(f, a, b) {
      for (let i = 0; i < 25; i++) { let m = (a + b) / 2; if (f(a) * f(m) < 0) b = m; else a = m; }
      return (a + b) / 2;
    }

    function renderResults() {
      const list = document.getElementById('results-list');
      list.innerHTML = '';
      roots.forEach((r, i) => {
        list.innerHTML += `<div style="padding:5px 0; border-bottom:1px solid #f1f5f9;">
          <span style="color:#ff00ea; font-weight:bold;">x${i + 1}</span> ≈ ${r.toFixed(6)}
        </div>`;
      });
      if (roots.length === 0) list.innerHTML = 'Ildiz topilmadi.';
    }

    wrap.addEventListener('wheel', e => {
      e.preventDefault();
      let zoom = e.deltaY > 0 ? 1.1 : 0.9;
      viewW *= zoom; viewH *= zoom; draw();
    });

    let dragging = false, lastX, lastY;
    wrap.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      let dx = (e.clientX - lastX) / W * viewW;
      let dy = (e.clientY - lastY) / H * viewH;
      viewX -= dx; viewY += dy;
      lastX = e.clientX; lastY = e.clientY; draw();
    });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('resize', resize);

    resize();
    updateKaTeX();
  </script>

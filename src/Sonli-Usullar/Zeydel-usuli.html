  <style>
    /* Matritsa qatorlari uchun konteyner */
    .matrix-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed #ddd;
    }

    /* Har bir x_i bloki */
    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .matrix-input {
      width: 60px;
      text-align: center;
      border: 2px solid #000;
      padding: 4px;
      font-family: monospace;
      font-weight: bold;
      font-size: 14px;
    }

    .equal-sign {
      font-weight: 900;
      color: #0891b2;
      padding: 0 10px;
    }

    .b-column {
      background-color: #f8fafc;
      border-left: 2px solid #000;
      padding-left: 10px;
    }
  </style>

  <script>
    let N = 3;

    window.onload = () => buildMatrix();

    function changeSize(delta) {
      N = Math.max(2, Math.min(10, N + delta));
      document.getElementById('n-display').innerText = N;
      buildMatrix();
      document.getElementById('solutionWrapper').classList.add('hidden');
    }

    function buildMatrix() {
      const container = document.getElementById('matrix-container');
      container.innerHTML = ''; // Tozalash

      // Daftardagi misol qiymatlari
      const defaultA = [[5, 1, 1], [1, 4, 1], [1, 1, 8]];
      const defaultB = [-7, -6, -10];

      for (let i = 0; i < N; i++) {
        const row = document.createElement('div');
        row.className = 'matrix-row';

        let rowHtml = '';
        // A koeffitsiyentlari (x1, x2, x3...)
        for (let j = 0; j < N; j++) {
          let val = (N === 3) ? defaultA[i][j] : (i === j ? 10 : 1);
          rowHtml += `
        <div class="input-group">
          <input type="number" id="a-${i}-${j}" value="${val}" class="matrix-input">
          <span class="text-xs font-black">x<sub>${j + 1}</sub></span>
          ${j < N - 1 ? '<span class="text-gray-400 font-bold">+</span>' : ''}
        </div>`;
        }

        // Tenglik va B ustuni
        let bVal = (N === 3) ? defaultB[i] : 20;
        rowHtml += `
      <div class="input-group b-column">
        <span class="equal-sign">=</span>
        <input type="number" id="b-${i}" value="${bVal}" class="matrix-input bg-cyan-50">
      </div>`;

        row.innerHTML = rowHtml;
        container.appendChild(row);
      }
    }

    function solveZeydel() {
      const eps = parseFloat(document.getElementById('eps').value);
      const wrapper = document.getElementById('solutionWrapper');
      const formulaContainer = document.getElementById('formulaContainer');
      const stepsContainer = document.getElementById('stepsContainer');
      const tbody = document.getElementById('tableBody');
      const thead = document.getElementById('tableHead');
      const verificationContent = document.getElementById('verificationContent');

      let A = [], B = [];
      for (let i = 0; i < N; i++) {
        A[i] = [];
        for (let j = 0; j < N; j++) A[i][j] = parseFloat(document.getElementById(`a-${i}-${j}`).value);
        B[i] = parseFloat(document.getElementById(`b-${i}`).value);
      }

      // Jadval sarlavhasi
      let headHtml = `<th class="px-4 py-3">№</th>`;
      for (let i = 1; i <= N; i++) headHtml += `<th class="px-4 py-3 text-cyan-600">x<sub>${i}</sub></th>`;
      headHtml += `<th class="px-4 py-3">Max Δ</th>`;
      thead.innerHTML = headHtml;

      // 1. Formulalar
      let formulaHtml = "";
      for (let i = 0; i < N; i++) {
        let others = [];
        for (let j = 0; j < N; j++) {
          if (i !== j) {
            let sign = A[i][j] >= 0 ? '-' : '+';
            others.push(`${sign} (${Math.abs(A[i][j])}x_{${j + 1}})`);
          }
        }
        formulaHtml += `<div class="p-2 border rounded">$x_{${i + 1}} = \\frac{1}{${A[i][i]}} [ ${B[i]} ${others.join(' ')} ]$</div>`;
      }
      formulaContainer.innerHTML = formulaHtml;

      // 2. Iteratsiyalar
      stepsContainer.innerHTML = '';
      tbody.innerHTML = '';
      verificationContent.innerHTML = '';
      wrapper.classList.remove('hidden');

      let X = new Array(N).fill(0);
      let iteration = 0;
      let maxDiff = 1;
      let lastDifferences = [];

      while (maxDiff > eps && iteration < 40) {
        iteration++;
        let X_old = [...X];
        let stepDiv = document.createElement('div');
        stepDiv.className = 'step-box';
        let stepHtml = `<h4 class="font-black text-black mb-3">Qadam №${iteration}</h4><div class="space-y-2">`;

        lastDifferences = [];

        for (let i = 0; i < N; i++) {
          let sum = 0;
          let calcPath = `${B[i]}`;
          for (let j = 0; j < N; j++) {
            if (i !== j) {
              sum += A[i][j] * X[j];
              let sign = A[i][j] >= 0 ? '-' : '+';
              calcPath += ` ${sign} (${Math.abs(A[i][j])} \\cdot ${X[j].toFixed(4)})`;
            }
          }
          X[i] = (B[i] - sum) / A[i][i];
          stepHtml += `<div class="text-[12px]">$x_{${i + 1}}^{(${iteration})} = \\frac{1}{${A[i][i]}} [ ${calcPath} ] = ${X[i].toFixed(6)}$</div>`;
        }

        maxDiff = 0;
        let rowHtml = `<tr class="border-b hover:bg-gray-50"><td class="px-4 py-2 font-bold">${iteration}</td>`;
        for (let i = 0; i < N; i++) {
          let diff = Math.abs(X[i] - X_old[i]);
          lastDifferences.push(diff);
          maxDiff = Math.max(maxDiff, diff);
          rowHtml += `<td class="px-4 py-2">${X[i].toFixed(6)}</td>`;
        }
        rowHtml += `<td class="px-4 py-2 font-bold ${maxDiff <= eps ? 'text-green-600' : 'text-red-500'}">${maxDiff.toFixed(6)}</td></tr>`;

        stepHtml += `</div>`;
        stepDiv.innerHTML = stepHtml;
        stepsContainer.appendChild(stepDiv);
        tbody.insertAdjacentHTML('beforeend', rowHtml);
      }

      // 4. Oxirgi tekshiruv (Yashil rangda)
      let verifHtml = "";
      lastDifferences.forEach((d, idx) => {
        let isOk = d <= eps;
        // Formula qismini $ belgisi bilan o'raymiz
        verifHtml += `
    <div class="flex items-center gap-4 p-3 ${isOk ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} border rounded">
      <span class="font-mono text-sm">$|x_{${idx + 1}}^{(${iteration})} - x_{${idx + 1}}^{(${iteration - 1})}| = ${d.toFixed(6)}$</span>
      <span class="font-black ${isOk ? 'delta-success' : 'text-red-600'}"> 
        ${isOk ? ' < ' : ' > '} ε (${eps}) ${isOk ? '✅ QANOATLANTIRADI' : '❌'}
      </span>
    </div>`;
      });
      verificationContent.innerHTML = verifHtml;

      // KaTeX render
      renderMathInElement(wrapper, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });

      window.scrollTo({ top: wrapper.offsetTop - 50, behavior: 'smooth' });
    }
  </script>

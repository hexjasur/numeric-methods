<body class="p-4 md:p-8">

  <script>
    window.SIDEBAR_BASE = '../../';
    window.SIDEBAR_ACTIVE = 'zeydel';
  </script>
  <script src="../assets/js/sidebar.js"></script>

  <div class="main-content" id="main-content">
    <div class="max-w-4xl mx-auto">

      <header class="p-8 mb-10 text-center cyber-header">
        <h1 class="text-3xl font-black tracking-widest text-black" style="font-family:'Orbitron',sans-serif">
          ZEYDEL <span style="color:#0891b2">USULI</span>
        </h1>
        <p class="mt-2 text-xs font-bold tracking-widest uppercase text-cyan-600">
          QarDU | Amaliy Matematika | Haydarov Jasurbek
        </p>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="md:col-span-1">
          <h3 class="font-black mb-3 uppercase text-xs text-gray-500">Misollar tanlash</h3>
          <div class="space-y-3">
            <button onclick="loadExample(1)" class="w-full text-left p-3 cyber-card hover:bg-cyan-50 text-sm font-bold">
              1-Misol (Rasmda): <br>
              <span class="text-[10px] text-gray-500">sin(y)+2x=2, cos(x-1)+y=0.5</span>
            </button>
            <button onclick="loadExample(2)" class="w-full text-left p-3 cyber-card hover:bg-cyan-50 text-sm font-bold">
              2-Misol (Matnda): <br>
              <span class="text-[10px] text-gray-500">sin(y)+2x=2, cos(x-1)+y=0</span>
            </button>
          </div>
        </div>

        <div class="md:col-span-2 cyber-card p-6">
          <h3 class="font-black mb-4 border-b-2 border-black pb-2 uppercase text-sm"
            style="font-family:'Orbitron',sans-serif">
            📥 Parametrlar va Tenglama
          </h3>
          <div class="mb-6 space-y-4">
            <div>
              <label class="block text-[10px] font-bold text-cyan-600 mb-1 uppercase tracking-widest">1-tenglama: f₁(x,
                y)
                = 0</label>
              <input type="text" id="func1" value="sin(y) + 2*x - 2"
                class="w-full bg-black text-cyan-400 p-3 font-mono border-2 border-black outline-none focus:border-cyan-500"
                placeholder="Masalan: sin(y) + 2*x - 2">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-cyan-600 mb-1 uppercase tracking-widest">2-tenglama: f₂(x,
                y)
                = 0</label>
              <input type="text" id="func2" value="cos(x - 1) + y - 0.5"
                class="w-full bg-black text-cyan-400 p-3 font-mono border-2 border-black outline-none focus:border-cyan-500"
                placeholder="Masalan: cos(x - 1) + y - 0.5">
            </div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div>
              <label class="block text-[10px] font-bold text-gray-400 mb-1">x₀</label>
              <input type="number" id="x0" value="1" step="0.1"
                class="w-full border-2 border-black px-2 py-1 outline-none focus:border-cyan-500 font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-gray-400 mb-1">y₀</label>
              <input type="number" id="y0" value="-0.3" step="0.1"
                class="w-full border-2 border-black px-2 py-1 outline-none focus:border-cyan-500 font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-gray-400 mb-1">EPS (ε)</label>
              <input type="number" id="eps" value="0.01" step="0.001"
                class="w-full border-2 border-black px-2 py-1 outline-none focus:border-cyan-500 font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-gray-400 mb-1">M₁</label>
              <input type="number" id="m1" value="2"
                class="w-full border-2 border-black px-2 py-1 outline-none focus:border-cyan-500 font-mono">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-gray-400 mb-1">M₂</label>
              <input type="number" id="m2" value="3"
                class="w-full border-2 border-black px-2 py-1 outline-none focus:border-cyan-500 font-mono">
            </div>
          </div>
          <button onclick="solve()" class="cyber-button px-12 py-3 text-sm font-black w-full uppercase">
            Hisoblashni boshlash
          </button>
        </div>
      </div>

      <div id="solutionWrapper" class="hidden space-y-8">

        <div class="cyber-card p-6">
          <h3 class="font-black mb-4 border-b-2 border-black pb-2 text-sm uppercase">1. Yaqinlashish sharti va Formulasi
          </h3>

          <div id="derivativesContainer" class="mb-4"></div>
        </div>

        <div class="cyber-card p-6">
          <h3 class="font-black mb-4 border-b-2 border-black pb-2 text-sm uppercase">2. Batafsil Iteratsiyalar</h3>
          <div id="stepsContainer"></div>
        </div>

        <div class="cyber-card p-6">
          <h3 class="font-black mb-4 border-b-2 border-black pb-2 text-sm uppercase">3. Natijalar Jadvali</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead class="bg-gray-50 border-b text-gray-400 text-[10px] font-black uppercase">
                <tr>
                  <th class="px-4 py-3">№</th>
                  <th class="px-4 py-3">x<sub>n</sub></th>
                  <th class="px-4 py-3">y<sub>n</sub></th>
                  <th class="px-4 py-3">|x<sub>n</sub> - x<sub>n-1</sub>|</th>
                  <th class="px-4 py-3">Holat</th>
                </tr>
              </thead>
              <tbody id="tableBody" class="font-mono text-sm"></tbody>
            </table>
          </div>
          <div id="finalNote"
            class="mt-6 p-4 bg-green-50 border-2 border-green-400 text-green-800 text-center font-black rounded"></div>
        </div>

      </div>

      <footer class="mt-12 text-center pb-8">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
          © 2026 QarDU Amaliy Matematika | Dasturchi: Haydarov Jasurbek
        </p>
      </footer>
    </div>
  </div>

  <script>
    let currentConst = 0.5;

    function loadExample(id) {
      if (id === 1) {
        document.getElementById('equationDisplay').innerHTML = "{ sin(y) + 2x = 2 <br> { cos(x-1) + y = 0.5";
        document.getElementById('y0').value = "-0.3";
        document.getElementById('m2').value = "3";
        currentConst = 0.5;
      } else {
        document.getElementById('equationDisplay').innerHTML = "{ sin(y) + 2x = 2 <br> { cos(x-1) + y = 0";
        document.getElementById('y0').value = "-0.3";
        document.getElementById('m2').value = "1";
        currentConst = 0;
      }
      document.getElementById('solutionWrapper').classList.add('hidden');
    }

    function solve() {
      const x0 = parseFloat(document.getElementById('x0').value);
      const y0 = parseFloat(document.getElementById('y0').value);
      const eps = parseFloat(document.getElementById('eps').value);
      const m1 = parseFloat(document.getElementById('m1').value);
      const m2 = parseFloat(document.getElementById('m2').value);

      const f1_str = document.getElementById('func1').value;
      const f2_str = document.getElementById('func2').value;

      const stepsContainer = document.getElementById('stepsContainer');
      const tbody = document.getElementById('tableBody');
      const wrapper = document.getElementById('solutionWrapper');

      // Hosila hisblash
      try {
        const df1_dx = math.derivative(f1_str, 'x').toTex();
        const df1_dy = math.derivative(f1_str, 'y').toTex();
        const df2_dx = math.derivative(f2_str, 'x').toTex();
        const df2_dy = math.derivative(f2_str, 'y').toTex();

        const derivativesContainer = document.getElementById('derivativesContainer');
        derivativesContainer.innerHTML = `
            <div class="bg-blue-50 p-4 rounded border border-blue-200 mb-4">
              <h4 class="font-bold text-blue-800 mb-3 text-xs uppercase tracking-widest">Xususiy hosilalar:</h4>
              <div class="grid grid-cols-2 gap-4 font-mono text-sm">
                  <div>$f'_{1x} = ${df1_dx}$</div>
                  <div>$f'_{1y} = ${df1_dy}$</div>
                  <div>$f'_{2x} = ${df2_dx}$</div>
                  <div>$f'_{2y} = ${df2_dy}$</div>
              </div>
            </div>
          `;

        // Hosilalarni KaTeX orqali render qilish
        renderMathInElement(derivativesContainer, {
          delimiters: [
            { left: "$", right: "$", display: false },
            { left: "$$", right: "$$", display: true }
          ],
          throwOnError: false
        });
      } catch (err) {
        console.log("Hosila olishda xatolik:", err);
      }
      // =======================================

      stepsContainer.innerHTML = '';
      tbody.innerHTML = '';
      wrapper.classList.remove('hidden');

      let x = x0;
      let y = y0;
      let iteration = 0;
      let diff = 100;

      try {
        while (diff > eps && iteration < 20) {
          iteration++;
          let xOld = x;
          let yOld = y;

          let f1_val = math.evaluate(f1_str, { x: xOld, y: yOld });
          let xNew = xOld - (f1_val / m1);
          let f2_val = math.evaluate(f2_str, { x: xNew, y: yOld });
          let yNew = yOld - (f2_val / m2);

          // Ikkala ayirmani tekshiramiz
          let diffX = Math.abs(xNew - xOld);
          let diffY = Math.abs(yNew - yOld);
          diff = Math.max(diffX, diffY); // Eng kattasini olamiz

          const stepDiv = document.createElement('div');
          stepDiv.className = 'step-box';
          stepDiv.innerHTML = `
            <h4 class="font-black text-cyan-600 mb-2">${iteration}-yaqinlashish:</h4>
            <div class="math-font text-sm space-y-4">
                <div>
                    $x_{${iteration}} = ${xOld.toFixed(6)} - \\frac{f_1(${xOld.toFixed(6)}, ${yOld.toFixed(6)})}{${m1}}$ <br>
                    $x_{${iteration}} = ${xNew.toFixed(6)}$
                </div>
                <div>
                    $y_{${iteration}} = ${yOld.toFixed(6)} - \\frac{f_2(${xNew.toFixed(6)}, ${yOld.toFixed(6)})}{${m2}}$ <br>
                    $y_{${iteration}} = ${yNew.toFixed(6)}$
                </div>
                <p class="text-gray-400 text-[10px] border-t pt-1">
                    Farq: $\\Delta x = ${diffX.toFixed(6)}, \\Delta y = ${diffY.toFixed(6)}$ <br>
                    <b>Max $\\Delta$: ${diff.toFixed(6)}</b>
                </p>
            </div>
        `;
          stepsContainer.appendChild(stepDiv);

          const row = `
                <tr class="border-b border-gray-100 ${diff <= eps ? 'bg-green-50' : ''}">
                    <td class="px-4 py-3 text-gray-400">${iteration}</td>
                    <td class="px-4 py-3">${xNew.toFixed(6)}</td>
                    <td class="px-4 py-3">${yNew.toFixed(6)}</td>
                    <td class="px-4 py-3 font-bold text-cyan-600">${diff.toFixed(6)}</td>
                    <td class="px-4 py-3">${diff <= eps ? '✅ TAMOM' : '...'}</td>
                </tr>
            `;
          tbody.insertAdjacentHTML('beforeend', row);

          x = xNew;
          y = yNew;
        }
        document.getElementById('finalNote').innerText = `Natija: x ≈ ${x.toFixed(6)}, y ≈ ${y.toFixed(6)} (${iteration} qadam)`;

        // MUHIM: KaTeX-ni aynan mana shu yerda chaqiramiz
        renderMathInElement(stepsContainer, {
          delimiters: [
            { left: "$", right: "$", display: false },
            { left: "$$", right: "$$", display: true }
          ],
          throwOnError: false
        });

      } catch (error) {
        alert("Xatolik! Formulani tekshiring.");
        console.error(error);
      }
      window.scrollTo({ top: wrapper.offsetTop - 20, behavior: 'smooth' });
    }

    // Sahifa birinchi marta ochilganda hamma statik formulalarni render qilish
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    });
  </script>
</body>

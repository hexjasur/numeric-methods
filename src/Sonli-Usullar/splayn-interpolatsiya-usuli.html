  <script>
    let chartInstance = null;

    const addPoint = () => {
      const tbody = document.getElementById('points-tbody');

    };

    const removePoint = () => {

    const examples = [
      {

        tx: 1.5
      },
      {

      },
      {

        pts: [
          [0.2, 1.2214],
          [0.24, 1.2710],
          [0.27, 1.3100],
          [0.30, 1.3499],
          [0.32, 1.3771],
          [0.38, 1.4623]
        ],
        tx: 0.22
      }
    ];

    const renderExamples = () => {
      const container = document.getElementById('examples-container');
      container.innerHTML = '';
      examples.forEach((ex, idx) => {
        const btn = document.createElement('button');
        btn.className = "text-left p-3 border border-slate-200 hover:bg-blue-50 transition-all text-[10px] font-bold text-slate-600 uppercase tracking-tight cyber-card shadow-none hover:shadow-sm";
        btn.onclick = () => applyExample(idx);

        const pointsPreview = ex.pts.map((p, i) => `(x<sub>${i}</sub>=${p[0]}, y<sub>${i}</sub>=${p[1]})`).join(' ');

        btn.innerHTML = `
                    <div class="text-blue-600 mb-1">${ex.label}</div>
                    <div class="text-[9px] text-gray-400 font-normal normal-case leading-relaxed">
                        ${pointsPreview}
                    </div>
                    <div class="text-[8px] text-blue-400 mt-2 font-black">TEST: x = ${ex.tx}</div>
                `;
        container.appendChild(btn);
      });
    };

    const applyExample = (index) => {
      const ex = examples[index];
      const tbody = document.getElementById('points-tbody');
      tbody.innerHTML = '';
      ex.pts.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
                    <td class="text-[10px] text-gray-400 font-mono">${i}</td>
                    <td><input type="text" class="x-input notebook-input" value="${p[0]}"></td>
                    <td><input type="text" class="y-input notebook-input" value="${p[1]}"></td>
                    <td><button onclick="this.parentElement.parentElement.remove()" class="text-red-400 hover:text-red-600 font-bold">×</button></td>
                `;
        tbody.appendChild(tr);
      });
      document.getElementById('eval-x').value = ex.tx;
      runSpline();
    };

    const computeH = (x) => {
      const h = [];
      for (let i = 0; i < x.length - 1; i++) h.push(x[i + 1] - x[i]);
      return h;
    };

    const solveTridiagonal = (x, y, h) => {
      const n = x.length - 1;
      const EPS = 1e-12;

      // ✅ 1. x tartibini tekshirish
      for (let i = 1; i < x.length; i++) {
        if (x[i] <= x[i - 1]) {
          throw new Error("x values must be strictly increasing");
        }
      }

      // ✅ 2. h nol emasligini tekshirish
      for (let i = 0; i < h.length; i++) {
        if (Math.abs(h[i]) < EPS) {
          throw new Error("Duplicate x values detected (h = 0)");
        }
      }

      const A = new Array(n + 1).fill(0);
      const B = new Array(n + 1).fill(0);
      const C = new Array(n + 1).fill(0);
      const D = new Array(n + 1).fill(0);

      // Koefitsiyentlar
      for (let i = 1; i < n; i++) {
        A[i] = h[i - 1] / 6;
        B[i] = (h[i - 1] + h[i]) / 3;
        C[i] = h[i] / 6;
        D[i] = (y[i + 1] - y[i]) / h[i] - (y[i] - y[i - 1]) / h[i - 1];
      }

      const alpha = new Array(n + 1).fill(0);
      const beta = new Array(n + 1).fill(0);

      // 🔥 Progonka (forward)
      for (let i = 1; i < n; i++) {
        const den = B[i] + A[i] * alpha[i];

        // ✅ 3. Division check
        if (Math.abs(den) < EPS) {
          throw new Error(`Numerical instability at i=${i} (den ≈ 0)`);
        }

        alpha[i + 1] = -C[i] / den;
        beta[i + 1] = (D[i] - A[i] * beta[i]) / den;
      }

      const M = new Array(n + 1).fill(0);

      // Natural spline
      M[0] = 0;
      M[n] = 0;

      // 🔥 Backward
      for (let i = n - 1; i >= 1; i--) {
        M[i] = alpha[i + 1] * M[i + 1] + beta[i + 1];

        // NaN check (extra safety)
        if (!isFinite(M[i])) {
          throw new Error(`Computation failed at i=${i} (NaN detected)`);
        }
      }

      return M;
    };

    const expandPolynomial = (xi, xi1, yi, yi1, hi, Mi, Mi1) => {
      const A = xi, B = xi1;
      const Ci = (yi / hi) - (Mi * hi / 6);
      const Di = (yi1 / hi) - (Mi1 * hi / 6);
      const a = (Mi1 - Mi) / (6 * hi);
      const b = (3 * Mi * B - 3 * Mi1 * A) / (6 * hi);
      const c = (3 * Mi1 * A ** 2 - 3 * Mi * B ** 2) / (6 * hi) - Ci + Di;
      const d = (Mi * B ** 3 - Mi1 * A ** 3) / (6 * hi) + (Ci * B) - (Di * A);
      return { a, b, c, d };
    };

    const parseMath = (val) => {
      try {
        if (typeof math !== 'undefined' && math.evaluate) {
          return math.evaluate(val);
        }
        if (val.includes('/')) {
          const parts = val.split('/');
          return parseFloat(parts[0]) / parseFloat(parts[1]);
        }
        return parseFloat(val);
      } catch (e) {
        return NaN;
      }
    };

    const runSpline = () => {
      const xInputs = Array.from(document.querySelectorAll('.x-input')).map(i => parseMath(i.value));
      const yInputs = Array.from(document.querySelectorAll('.y-input')).map(i => parseMath(i.value));
      const tx = parseMath(document.getElementById('eval-x').value);
      const points = xInputs.map((val, idx) => ({ x: val, y: yInputs[idx] }))
        .filter(p => !isNaN(p.x) && !isNaN(p.y))
        .sort((a, b) => a.x - b.x);
      if (points.length < 3) return;
      const x = points.map(p => p.x);
      const y = points.map(p => p.y);
      const h = computeH(x);
      const M = solveTridiagonal(x, y, h);
      const splines = x.slice(0, -1).map((_, i) => ({
        interval: [x[i], x[i + 1]],
        coeffs: expandPolynomial(x[i], x[i + 1], y[i], y[i + 1], h[i], M[i], M[i + 1]),
        params: { xi: x[i], xi1: x[i + 1], yi: y[i], yi1: y[i + 1], hi: h[i], Mi: M[i], Mi1: M[i + 1] }
      }));
      renderStepByStep(x, y, h, M, splines, tx);
      renderGraph(x, y, splines, tx);
    };

    const renderStepByStep = (x, y, h, M, splines, tx) => {
      document.getElementById('empty-state').classList.add('hidden');
      const area = document.getElementById('results-area');
      area.classList.remove('hidden');
      area.innerHTML = '';

      const addSection = (title, content) => {
        const div = document.createElement('div');
        div.className = 'cyber-card p-8';
        div.innerHTML = `<h3 class="step-title">${title}</h3><div>${content}</div>`;
        area.appendChild(div);
      };

      const fV = (v) => v.toFixed(4);

      // 1. Masala
      let pts = "\\{ " + x.map((xv, i) => `(${xv}, ${y[i]})`).join(', ') + " \\}";
      addSection("1. 📌 Masalaning berilishi", `
                <div class="math-block">$$ ${pts} $$</div>
                <p>Tekshirish nuqtasi: <b>$x = ${tx}$</b></p>
            `);

      // 2. Formula
      addSection("2. 📐 Umumiy spline formulasi", `
                <div class="math-block">$$ S_{i}(x) = a_i + b_i(x - x_i) + c_i(x - x_i)^2 + d_i(x - x_i)^3 $$</div>
                <div class="math-block">
                $$ S_i(x) = \\frac{M_i(x_{i+1}-x)^3}{6h_i} + \\frac{M_{i+1}(x-x_i)^3}{6h_i} + \\left(y_i - \\frac{M_i h_i^2}{6}\\right)\\frac{x_{i+1}-x}{h_i} + \\left(y_{i+1} - \\frac{M_{i+1} h_i^2}{6}\\right)\\frac{x-x_i}{h_i} $$
                </div>
            `);

      // 3. H
      let hC = h.map((val, i) => `$$ h_{${i + 1}} = x_{${i + 1}} - x_{${i}} = ${x[i + 1]} - ${x[i]} = ${val.toFixed(4)} $$`).join('');
      addSection("3. 📏 Qadam o'lchamlari ($h_i$)", `<div class="math-block">${hC}</div>`);

      // 4. M
      let mL = M.map((val, i) => `M_{${i}} = ${val.toFixed(6)}`).join(', ');
      addSection("4. 🧮 Momentlar tizimi ($M_i$)", `
                <div class="math-block">$$ h_{i-1}M_{i-1} + 2(h_{i-1} + h_i)M_i + h_i M_{i+1} = 6\\left[ \\frac{y_{i+1}-y_i}{h_i} - \\frac{y_i-y_{i-1}}{h_{i-1}} \\right] $$</div>
                <p>Natural splayn: $M_0 = 0, M_n = 0$</p>
                <div class="math-block">$$ ${mL} $$</div>
            `);

      // 5. Splines
      let phtml = splines.map((s, i) => {
        const p = s.params, c = s.coeffs;
        const Ci = (p.yi / p.hi) - (p.Mi * p.hi / 6);
        const Di = (p.yi1 / p.hi) - (p.Mi1 * p.hi / 6);
        const sub = `S_{${i + 1}}(x) = \\frac{${fV(p.Mi)}(${p.xi1}-x)^3}{6 \\cdot ${fV(p.hi)}} + \\frac{${fV(p.Mi1)}(x-${p.xi})^3}{6 \\cdot ${fV(p.hi)}} + ${fV(Ci)}(${p.xi1}-x) + ${fV(Di)}(x-${p.xi})`;
        const poly = `S_{${i + 1}}(x) = ${fV(c.a)}x^3 ${c.b >= 0 ? '+' : ''} ${fV(c.b)}x^2 ${c.c >= 0 ? '+' : ''} ${fV(c.c)}x ${c.d >= 0 ? '+' : ''} ${fV(c.d)}`;
        return `<div class="mb-6 p-6 bg-slate-50 border-2 border-slate-100 relative">
                    <p class="absolute -top-3 left-4 bg-blue-600 text-white text-[10px] font-black px-3 py-1 uppercase tracking-widest">Interval [${p.xi}, ${p.xi1}]</p>
                    <div class="math-block text-sm">$$ ${sub} $$</div>
                    <div class="math-block text-lg font-bold border-blue-200 bg-blue-50/50">$$ ${poly} $$</div>
                </div>`;
      }).join('');
      addSection("5. 🧩 Har bir interval uchun $S_i(x)$ ni hosil qilish", phtml);

      // 6, 7, 8
      let act = splines.find(s => tx >= s.interval[0] && tx <= s.interval[1]) || splines[0];
      const c = act.coeffs;
      const res = c.a * tx ** 3 + c.b * tx ** 2 + c.c * tx + c.d;
      addSection("6. 📍 Interval", `<div class="math-block text-center font-bold text-blue-600">$$ x \\in [${act.interval[0]}, ${act.interval[1]}] $$</div>`);
      addSection("7. 🧪 Hisob", `<div class="math-block">$$ S(${tx}) = ${fV(c.a)}(${tx})^3 + ${fV(c.b)}(${tx})^2 + ${fV(c.c)}(${tx}) + ${fV(c.d)} $$</div>`);
      addSection("8. ✅ Javob", `
            <div class="bg-black p-8 text-white text-center cyber-card" style="box-shadow: 8px 8px 0px #2563eb;">
                <p class="text-[10px] font-black uppercase mb-4 tracking-[0.3em] text-blue-400">Yakuniy Natija</p>
                <div class="text-4xl font-black mb-2">$$ f(${tx}) \\approx ${res.toFixed(6)} $$</div>
                <div class="h-1 w-20 bg-blue-600 mx-auto"></div>
            </div>`);

      if (window.renderMathInElement) {
        renderMathInElement(area, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    };

    const renderGraph = (x, y, splines, tx) => {
      const ctx = document.getElementById('splineChart').getContext('2d');
      const cX = [], cY = [];
      const min = Math.min(...x), max = Math.max(...x);
      for (let i = 0; i <= 100; i++) {
        const cur = min + (max - min) * i / 100;
        cX.push(cur);
        const s = splines.find(sp => cur >= sp.interval[0] && cur <= sp.interval[1]) || splines[0];
        cY.push(s.coeffs.a * cur ** 3 + s.coeffs.b * cur ** 2 + s.coeffs.c * cur + s.coeffs.d);
      }
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: cX,
          datasets: [
            { label: 'Spline', data: cY, borderColor: '#2563eb', borderWidth: 3, pointRadius: 0, tension: 0.4, fill: true, backgroundColor: 'rgba(37, 99, 235, 0.05)' },
            { label: 'Tugunlar', data: x.map((xv, i) => ({ x: xv, y: y[i] })), backgroundColor: '#000', pointRadius: 5, pointHoverRadius: 8, showLine: false, type: 'scatter' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'linear' } } }
      });
    };
    window.onload = () => {
      renderExamples();
    };
  </script>
</body>

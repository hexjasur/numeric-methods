<body class="p-4 md:p-8">

  <!-- Main Content -->
  <div class="main-content" id="main-content">
    <div class="max-w-6xl mx-auto">
      <header class="p-6 mb-8 text-center cyber-card bg-white">
        <h1 class="text-3xl font-black tracking-tighter uppercase" style="font-family:'Orbitron'">
          Kesmani teng ikkiga bo'lish: <span class="text-cyan-500">Bisection Method</span>
        </h1>
        <p class="text-xs mt-2 font-mono text-gray-500">Qarshi DU | Amaliy Matematika yo'nalishi uchun maxsus</p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 space-y-6">
          <div class="p-6 cyber-card">
            <h3 class="font-bold border-b-2 border-black mb-4 flex items-center">
              <span class="mr-2">⚙️</span> PARAMETRLAR
            </h3>
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-bold mb-1">f(x) Funksiya:</label>
                <input type="text" id="equation" value="x^3 + x - 1"
                  class="w-full p-3 math-input rounded-lg outline-none" oninput="updateFormula()">
                <div id="formula-preview" class="mt-2 p-2 bg-gray-100 rounded text-center min-h-[40px]"></div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-bold mb-1">a (Boshi):</label>
                  <input type="number" id="inputA" value="0" step="0.1"
                    class="w-full p-2 border-2 border-black rounded">
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">b (Oxiri):</label>
                  <input type="number" id="inputB" value="1" step="0.1"
                    class="w-full p-2 border-2 border-black rounded">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Aniqlik (ε):</label>
                <input type="number" id="inputEps" value="0.01" step="0.001"
                  class="w-full p-2 border-2 border-black rounded">
              </div>
              <button onclick="calculate()" class="w-full py-4 font-black cyber-button uppercase">Hisoblashni
                Boshlash</button>
            </div>
          </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
          <div id="resultCard" class="p-6 cyber-card bg-cyan-50 hidden">
            <div class="flex justify-between items-center">
              <div>
                <p class="text-xs font-bold text-cyan-700 uppercase">Topilgan Ildiz:</p>
                <h2 id="finalX" class="text-4xl font-black text-black">0.000000</h2>
              </div>
              <div class="text-right">
                <p class="text-xs font-bold text-gray-500 uppercase">Iteratsiyalar:</p>
                <p id="iterCount" class="text-2xl font-mono">0</p>
              </div>
            </div>
          </div>

          <div class="p-6 cyber-card h-[600px] flex flex-col">
            <h3 class="font-bold border-b-2 border-black mb-4 flex items-center">
              <span class="mr-2">📝</span> BOSQICHMA-BOSQICH YECHIM
            </h3>
            <div id="logs" class="overflow-y-auto flex-1 space-y-3 pr-2 custom-scrollbar">
              <p class="text-gray-400 italic">Ma'lumotlar kiritilib "Hisoblash" tugmasi bosilishi kutilmoqda...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div><!-- /main-content -->

  <script>
    // Formula preview funksiyasi
    function updateFormula() {
      const exp = document.getElementById('equation').value;
      const preview = document.getElementById('formula-preview');
      try {
        const node = math.parse(exp);
        const latex = node.toTex({ parenthesis: 'keep', implicit: 'hide' });
        katex.render("f(x) = " + latex, preview, { throwOnError: false });
      } catch (e) {
        preview.innerHTML = "<span class='text-red-500 text-xs'>Formula xato!</span>";
      }
    }

    window.onload = updateFormula;

    function calculate() {
      const exprStr = document.getElementById('equation').value;
      const a_init = parseFloat(document.getElementById('inputA').value);
      const b_init = parseFloat(document.getElementById('inputB').value);
      const eps = parseFloat(document.getElementById('inputEps').value);
      const logBox = document.getElementById('logs');
      const resultCard = document.getElementById('resultCard');

      logBox.innerHTML = "";
      resultCard.classList.add('hidden');

      try {
        const node = math.parse(exprStr);
        const code = node.compile();
        const f = (x) => code.evaluate({ x: x });

        let a = a_init;
        let b = b_init;
        let iter = 0;

        // Boshlang'ich tekshiruv
        let fa = f(a);
        let fb = f(b);

        if (fa * fb > 0) {
          logBox.innerHTML = `
            <div class="p-4 bg-red-100 border-l-4 border-red-500 text-red-700">
              <strong>Xatolik!</strong> f(a) va f(b) ishoralari bir xil. 
              Oraliqning chetki nuqtalarida f(a)·f(b) < 0 sharti bajarilishi shart. <br>
              f(${a}) = ${fa.toFixed(4)}, f(${b}) = ${fb.toFixed(4)}
            </div>`;
          return;
        }

        while ((b - a) > eps) {
          iter++;
          let c = (a + b) / 2;
          let fc = f(c);

          const stepDiv = document.createElement('div');
          stepDiv.className = "p-4 bg-white border border-gray-200 step-card rounded-lg shadow-sm text-sm";

          let signCheck = (fa * fc < 0) ?
            `f(a)·f(c) < 0 bo'lgani uchun yangi oraliq [a, c]` :
            `f(c)·f(b) < 0 bo'lgani uchun yangi oraliq [c, b]`;

          stepDiv.innerHTML = `
            <div class="flex justify-between font-bold text-cyan-600 mb-1">
                <span>QADAM #${iter}</span>
                <span>Oraliq uzunligi: ${(b - a).toFixed(6)}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 font-mono">
                <div>a = ${a.toFixed(6)} → f(a) = <span class="${fa < 0 ? 'is-negative' : 'is-positive'}">${fa.toFixed(6)}</span></div>
                <div>b = ${b.toFixed(6)} → f(b) = <span class="${fb < 0 ? 'is-negative' : 'is-positive'}">${fb.toFixed(6)}</span></div>
            </div>
            <div class="my-2 p-2 bg-gray-50 rounded border">
                <strong>Markaz:</strong> c = (a + b)/2 = <b>${c.toFixed(6)}</b><br>
                <strong>Qiymat:</strong> f(c) = <span class="${fc < 0 ? 'is-negative' : 'is-positive'}">${fc.toFixed(8)}</span>
            </div>
            <div class="text-xs text-gray-500 italic">Qaror: ${signCheck}</div>
          `;
          logBox.appendChild(stepDiv);

          if (Math.abs(fc) < 1e-15) break;

          if (fa * fc < 0) {
            b = c;
            fb = fc;
          } else {
            a = c;
            fa = fc;
          }

          if (iter > 100) break; // Cheksiz sikldan himoya
        }

        // Yakuniy natija
        const finalX = (a + b) / 2;
        document.getElementById('finalX').innerText = finalX.toFixed(Math.abs(Math.log10(eps)));
        document.getElementById('iterCount').innerText = iter;
        resultCard.classList.remove('hidden');

        logBox.scrollTop = 0;

      } catch (err) {
        logBox.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded">Xato: ${err.message}</div>`;
      }
    }
  </script>

        <div class="lg:col-span-4 space-y-6">

        </h2>

    <style>
      .input-box {
        width: 55px;
        text-align: center;
        border: 2px solid #000;
        padding: 4px;
        font-family: monospace;
        font-weight: bold;
        outline: none;
        min-width: 45px;
      }

      .input-box:focus {
        border-color: #2563eb;
      }

      .b-col {
        background-color: #eff6ff;
      }

      @media (max-width: 640px) {
        .input-box {
          width: 48px;
          padding: 3px;
          font-size: 12px;
        }
      }
    </style>

    <script>
      let N = 3; // Default o'lcham
      const maxLimit = 7;
      const minLimit = 2;

      // Default qiymatlar (3 talik misolingiz)
      const defaultA = [
        [3, 1, 1, 0, 0, 0, 0],
        [1, 4, 1, 0, 0, 0, 0],
        [1, 1, 5, 0, 0, 0, 0],
        [0, 0, 0, 10, 0, 0, 0],
        [0, 0, 0, 0, 10, 0, 0],
        [0, 0, 0, 0, 0, 10, 0],
        [0, 0, 0, 0, 0, 0, 10]
      ];
      const defaultB = [5, 6, 7, 10, 10, 10, 10];

      // Render KaTeX
      function renderKatex(element) {
        if (window.renderMathInElement) {
          renderMathInElement(element, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }
      }

      function changeSize(delta) {
        N = Math.max(minLimit, Math.min(maxLimit, N + delta));
        document.getElementById('n-display').innerText = N;
        buildMatrix();
        document.getElementById('resultsSection').classList.add('hidden');
        document.getElementById('finalAnswer').classList.add('hidden');
      }

      // Dinamik Matritsa qatlamini yaratish
      function buildMatrix() {
        const container = document.getElementById('matrix-container');
        container.innerHTML = '';

        for (let i = 0; i < N; i++) {
          let row = document.createElement('div');
          row.className = 'flex flex-wrap items-center gap-1 md:gap-2 p-2 hover:bg-gray-50 w-full';

          let rowHtml = `<span class="text-xs font-black text-gray-400 w-6">(${i + 1})</span>`;

          for (let j = 0; j < N; j++) {
            let val = (N === 3) ? defaultA[i][j] : (i === j ? 5 : 1); // Dioganal ustunlik uchun
            rowHtml += `
            <div class="flex items-center gap-1">
              <input type="number" id="a-${i}-${j}" value="${val}" step="any" oninput="updateFormulasPreview()" class="input-box">
              <span class="font-black text-sm">x<sub>${j + 1}</sub></span>
              ${j < N - 1 ? '<span class="font-bold text-gray-400 mx-1">+</span>' : '<span class="font-black text-blue-600 mx-2">=</span>'}
            </div>`;
          }

          let bVal = (N === 3) ? defaultB[i] : 10;
          rowHtml += `
          <div class="flex items-center gap-1 border-l-2 border-black pl-2">
            <input type="number" id="b-${i}" value="${bVal}" step="any" oninput="updateFormulasPreview()" class="input-box b-col">
          </div>`;

          row.innerHTML = rowHtml;
          container.appendChild(row);
        }
        updateFormulasPreview();
      }

      // Formularni N ga qarab dinamik chizish
      function updateFormulasPreview() {
        let html = '';
        for (let i = 0; i < N; i++) {
          let bVal = document.getElementById(`b-${i}`).value || 0;
          let aii = document.getElementById(`a-${i}-${i}`).value || 1;

          let sumStr = [];
          for (let j = 0; j < N; j++) {
            if (i !== j) {
              let aij = parseFloat(document.getElementById(`a-${i}-${j}`).value || 0);
              let sign = aij >= 0 ? '-' : '+';
              sumStr.push(`${sign} ${Math.abs(aij)} x_{${j + 1}}^{(k)}`);
            }
          }

          html += `<div class="p-2 bg-white border border-blue-200 shadow-sm">
                   $$x_{${i + 1}}^{(k+1)} = \\frac{${bVal} ${sumStr.join(' ')}}{${aii}}$$
                 </div>`;
        }

        const container = document.getElementById('formulasPreview');
        container.innerHTML = html;
        renderKatex(container);
      }

      function calculateJacobi() {
        const epsilon = parseFloat(document.getElementById('epsilon').value);
        const maxIter = 40;

        // Matritsani o'qib olish
        let A = [];
        let B = [];
        for (let i = 0; i < N; i++) {
          A[i] = [];
          B[i] = parseFloat(document.getElementById(`b-${i}`).value);
          for (let j = 0; j < N; j++) {
            A[i][j] = parseFloat(document.getElementById(`a-${i}-${j}`).value);
          }
        }

        // 0-qadamni hisoblash (Boshlang'ich yaqinlashish)
        let X = new Array(N).fill(0);
        let step0Html = `<div class="p-4 bg-gray-100 border-2 border-dashed border-gray-400 mb-6">
                        <div class="text-[12px] font-black uppercase text-gray-600 mb-3">Qadam №0 (Boshlang'ich yaqinlashish)</div>
                        <div class="grid grid-cols-1 gap-2 md:gap-3 lg:gap-4 md:grid-cols-2 lg:grid-cols-3">`;

        for (let i = 0; i < N; i++) {
          X[i] = B[i] / A[i][i];
          step0Html += `<div class="bg-white p-2 border-l-4 border-black shadow-sm text-sm md:text-base">
                        $$x_{${i + 1}}^{(0)} = \\frac{${B[i]}}{${A[i][i]}} = ${X[i].toFixed(6)}$$
                      </div>`;
        }
        step0Html += `</div></div>`;

        // Iteratsiyalar
        let resultsHtml = step0Html;
        let iter = 0;
        let converged = false;

        while (iter < maxIter && !converged) {
          iter++;
          let X_new = new Array(N).fill(0);
          let maxErr = 0;
          let errors = [];

          let cardHtml = `<div class="p-4 border-2 border-black bg-white mb-4">
                          <div class="flex items-center justify-between border-b-2 border-black pb-2 mb-3">
                            <span class="font-black uppercase tracking-widest bg-black text-white px-3 py-1 text-xs md:text-sm">Iteratsiya №${iter}</span>
                          </div>
                          <div class="grid grid-cols-1 gap-2 md:gap-3 lg:gap-4 md:grid-cols-2 lg:grid-cols-3">`;

          for (let i = 0; i < N; i++) {
            let sum = 0;
            let calcStr = `${B[i]}`;
            for (let j = 0; j < N; j++) {
              if (i !== j) {
                sum += A[i][j] * X[j];
                let sign = A[i][j] >= 0 ? '-' : '+';
                calcStr += ` ${sign} ${Math.abs(A[i][j])}(${X[j].toFixed(4)})`;
              }
            }

            X_new[i] = (B[i] - sum) / A[i][i];
            let err = Math.abs(X_new[i] - X[i]); // X[i] bu yerda hali (k-1) qiymatni saqlab turibdi
            errors.push(err);
            if (err > maxErr) maxErr = err;

            // Delta formulasini ham qo'shib karta hosil qilamiz
            cardHtml += `<div class="bg-blue-50/50 p-3 border border-blue-100">
              <div class="text-[10px] font-black text-blue-800 mb-1">X${i + 1} HISOBI</div>
              <div class="text-[12px] overflow-x-auto mb-2 pb-1">
                 $$x_{${i + 1}}^{(${iter})} = \\frac{${calcStr}}{${A[i][i]}} = ${X_new[i].toFixed(6)}$$
              </div>
              <div class="text-[10px] text-gray-600 font-bold border-t border-blue-100 pt-1 mt-1">
                 $$\\Delta x_{${i + 1}}^{(${iter})} = |${X_new[i].toFixed(6)} - ${X[i].toFixed(6)}| = ${err.toFixed(6)}$$
              </div>
            </div>`;
          }

          if (maxErr < epsilon) converged = true;

          // Belgini aniqlaymiz (kichik yoki katta)
          const sign = maxErr < epsilon ? '<' : '>';
          const statusText = maxErr < epsilon ? 'Yaqinlashdi ✅' : 'Davom etmoqda... ⏳';

          cardHtml += `
            </div>
            <div class="mt-4 p-3 border-t-2 border-double border-gray-400 bg-white/50">
                <div class="flex flex-col gap-1">
                    <div class="text-[12px] font-bold text-gray-700 italic">
                        Yaqinlashish sharti:
                    </div>
                    <div class="text-[14px] font-mono bg-gray-100 p-2 rounded border border-gray-200">
                        $$\\max |x_{i}^{(k+1)} - x_{i}^{(k)}| = ${maxErr.toFixed(6)} \\quad ${sign} \\quad \\epsilon (${epsilon})$$
                    </div>
                    <div class="text-[11px] font-black uppercase mt-2 ${converged ? 'text-green-600' : 'text-amber-600'} flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${converged ? 'bg-green-600' : 'bg-amber-600'} animate-pulse"></span>
                        Status: ${statusText}
                    </div>
                </div>
            </div>
        </div>
          `;

          resultsHtml += cardHtml;
          X = [...X_new];
        }

        // Natijalarni ekranga chiqarish
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');
        resultsContainer.innerHTML = resultsHtml;
        resultsSection.classList.remove('hidden');
        renderKatex(resultsContainer);

        // Yakuniy javob bloki
        const finalDiv = document.getElementById('finalAnswer');
        const finalContent = document.getElementById('finalAnswerContent');
        finalDiv.classList.remove('hidden');

        if (converged) {
          finalDiv.className = 'rounded-xl p-4 md:p-6 mt-6 border-2 border-green-600 bg-green-50 shadow-[4px_4px_0_#16a34a]';
          finalDiv.querySelector('h2').style.color = '#16a34a';
        } else {
          finalDiv.className = 'rounded-xl p-4 md:p-6 mt-6 border-2 border-red-600 bg-red-50 shadow-[4px_4px_0_#dc2626]';
          finalDiv.querySelector('h2').style.color = '#dc2626';
        }

        let finalCards = '';
        for (let i = 0; i < N; i++) {
          finalCards += `<div class="bg-white p-3 md:p-4 border-2 border-black text-center">
                         <div class="text-[10px] md:text-xs font-black uppercase opacity-60 mb-2 font-mono">X${i + 1}</div>
                         <div class="text-lg md:text-xl font-black">${X[i].toFixed(6)}</div>
                       </div>`;
        }

        finalContent.innerHTML = `
        <p class="text-xs uppercase font-black opacity-60 mb-4 md:mb-6 tracking-widest font-mono text-black">
          ${converged ? 'Muvaffaqiyatli topildi' : 'Max iteratsiyaga yetdi'} | ε: ${epsilon} | Iteratsiyalar: ${iter}
        </p>
        <div class="grid grid-cols-2 gap-2 md:gap-3 lg:gap-4 sm:grid-cols-3 md:grid-cols-4 text-black">
          ${finalCards}
        </div>
      `;

        resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // Initialize
      window.onload = () => {
        buildMatrix();
      };
    </script>

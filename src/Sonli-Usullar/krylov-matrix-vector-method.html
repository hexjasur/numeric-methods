            class="relative inline-flex items-center justify-center px-8 py-3 overflow-hidden font-bold border-2  rounded-lg bg-linear-to-br from-cyber-cyan to-cyber-magenta hover:shadow-[0_0_20px_rgba(217,70,239,0.5)] transition-all duration-300">

    <script>
      let currentSize = 4;

      const defaultMatrix = [
        [-1, 2, 2, 0],
        [2, 1, 3, 2],
        [2, -1, 2, 3],
        [0, 2, 1, -2]
      ];

      function changeSize(n) {
        currentSize = n;
        document.getElementById('size-label').textContent = `${n}x${n}`;

        document.querySelectorAll('.size-btn').forEach(btn => {
          if (btn.textContent === `${n}x${n}`) {
            btn.classList.add('bg-cyber-cyan', 'text-white', 'shadow-neon-cyan');
          } else {
            btn.classList.remove('bg-cyber-cyan', 'text-white', 'shadow-neon-cyan');
          }
        });

        const container = document.getElementById('matrix-inputs');
        let colsClass = '';
        if (n === 3) colsClass = 'grid-cols-3 max-w-sm';
        else if (n === 4) colsClass = 'grid-cols-4 max-w-md';
        else if (n === 5) colsClass = 'grid-cols-5 max-w-xl';

        container.className = `grid gap-3 mb-6 mx-auto ${colsClass}`;
        document.querySelector('.matrix-wrapper').style.setProperty('--matrix-rows', n);

        generateMatrix(n);
        document.getElementById('output-section').classList.add('hidden');
      }

      function generateMatrix(size) {
        const container = document.getElementById('matrix-inputs');
        container.innerHTML = '';

        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            const input = document.createElement('input');
            input.type = 'number';
            input.step = 'any';
            input.className = 'matrix-cell w-full bg-white/80 border-2 border-slate-200 focus:border-cyber-cyan rounded-lg text-center py-2 shadow-sm outline-none transition-colors duration-200';

            if (defaultMatrix[i] && defaultMatrix[i][j] !== undefined) {
              input.value = defaultMatrix[i][j];
            } else {
              input.value = (i === j) ? 1 : 0;
            }
            container.appendChild(input);
          }
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        changeSize(4);
      });
      // Matrix-Vector multiplication
      function multiplyMatrixVector(A, v) {
        let size = v.length;
        let res = new Array(size).fill(0);
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            res[i] += A[i][j] * v[j];
          }
        }
        return res;
      }

      // Gaussian Elimination to solve linear system M*x = b
      function gaussElimination(A, b) {
        let n = b.length;
        let M = [];
        for (let i = 0; i < n; i++) M.push([...A[i], b[i]]);

        for (let i = 0; i < n; i++) {
          let maxRow = i;
          for (let k = i + 1; k < n; k++) {
            if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
          }
          [M[i], M[maxRow]] = [M[maxRow], M[i]];

          // Avoid division by zero
          if (Math.abs(M[i][i]) < 1e-10) continue;

          for (let k = i + 1; k < n; k++) {
            let factor = M[k][i] / M[i][i];
            for (let j = i; j <= n; j++) {
              M[k][j] -= factor * M[i][j];
            }
          }
        }

        let x = new Array(n).fill(0);
        for (let i = n - 1; i >= 0; i--) {
          x[i] = M[i][n];
          for (let k = i + 1; k < n; k++) {
            x[i] -= M[i][k] * x[k];
          }
          if (Math.abs(M[i][i]) > 1e-10) {
            x[i] /= M[i][i];
          }
        }
        // Round to standard 4 decimal precision if needed, but integers should stay exact
        return x.map(val => {
          let rounded = Math.round(val * 10000) / 10000;
          return rounded;
        });
      }

      // LaTeX formatting helpers
      function texMatrix(M) {
        return `\\begin{pmatrix} ${M.map(row => row.join(' & ')).join(' \\\\ ')} \\end{pmatrix}`;
      }
      function texVector(v) {
        return `\\begin{pmatrix} ${v.join(' \\\\ ')} \\end{pmatrix}`;
      }
      function renderTex(str, elementId) {
        katex.render(str, document.getElementById(elementId), { throwOnError: false, displayMode: true });
      }
      function renderTexInline(str) {
        return katex.renderToString(str, { throwOnError: false, displayMode: false });
      }

      function calculateKrylov() {
        let size = currentSize;
        let inputs = document.querySelectorAll('.matrix-cell');
        let A = [];
        let idx = 0;
        for (let i = 0; i < size; i++) {
          let row = [];
          for (let j = 0; j < size; j++) {
            row.push(parseFloat(inputs[idx].value) || 0);
            idx++;
          }
          A.push(row);
        }

        // Define c(0)
        let c0 = new Array(size).fill(0);
        c0[0] = 1;

        const vectors = [c0];
        for (let k = 1; k <= size; k++) {
          vectors.push(multiplyMatrixVector(A, vectors[k - 1]));
        }

        let vHtml = '';
        vHtml += `<div class="py-2 text-center">${renderTexInline(`\\vec{c}^{(0)} = ${texVector(vectors[0])}`)}</div>`;

        for (let i = 1; i < vectors.length; i++) {
          const prevVec = texVector(vectors[i - 1]);
          const currentVec = texVector(vectors[i]);
          const matrixA = texMatrix(A);

          vHtml += `
        <div class="py-2 overflow-x-auto text-center">
            ${renderTexInline(`\\vec{c}^{(${i})} = A \\cdot \\vec{c}^{(${i - 1})} = ${matrixA} \\cdot ${prevVec} = ${currentVec}`)}
        </div>`;
        }

        document.getElementById('vectors-output').innerHTML = vHtml;

        // Step 2: System Setup
        let sysA = [];
        for (let i = 0; i < size; i++) {
          let row = [];
          for (let j = 1; j <= size; j++) {
            row.push(vectors[size - j][i]);
          }
          sysA.push(row);
        }

        let c_n = vectors[size];
        let p_vals = gaussElimination(sysA, c_n);

        // System Eq LaTeX
        let termsObj = [];
        for (let j = 1; j <= size; j++) {
          termsObj.push(`p_${j} ${texVector(vectors[size - j])}`);
        }
        let sysEq = termsObj.join(' + ') + ` = ${texVector(c_n)}`;
        renderTex(sysEq, 'system-output');

        // Expanded system
        let sysExpandedLines = [];
        for (let i = 0; i < size; i++) {
          let lineStr = "";
          for (let j = 1; j <= size; j++) {
            let coef = vectors[size - j][i];
            let sign = (j > 1 && coef >= 0) ? '+' : '';
            lineStr += `${sign}${coef}p_${j} `;
          }
          lineStr += `= ${c_n[i]}`;
          sysExpandedLines.push(lineStr);
        }
        let systemMatrixExpanded = `\\begin{cases}
                ${sysExpandedLines.join(' \\\\ \n')}
            \\end{cases}`;

        let solHtml = `<div class="mb-2 text-center text-slate-600 text-sm">Sistema ko'rinishi:</div>`;
        solHtml += `<div class="mb-4 text-center overflow-x-auto">${renderTexInline(systemMatrixExpanded)}</div>`;

        let pValsStr = [];
        for (let k = 0; k < size; k++) {
          pValsStr.push(`p_${k + 1} = ${p_vals[k]}`);
        }
        solHtml += `<div class="font-bold text-center text-cyber-magenta">${renderTexInline(pValsStr.join(', \\quad '))}</div>`;
        document.getElementById('solution-output').innerHTML = solHtml;

        // Step 3: Polynomial Builder
        let poly = `P(\\lambda) = \\lambda^{${size}}`;

        function formatCoef(val, power) {
          if (val === 0) return "";
          let sign = val > 0 ? "-" : "+";
          let num = Math.abs(val);
          let powerStr = "";
          if (power > 1) powerStr = `\\lambda^${power}`;
          else if (power === 1) powerStr = `\\lambda`;

          let numStr = (num === 1 && power > 0) ? "" : num;
          return ` ${sign} ${numStr}${powerStr}`;
        }

        for (let j = 0; j < size; j++) {
          poly += formatCoef(p_vals[j], size - 1 - j);
        }

        renderTex(poly, 'poly-output');

        // Show output
        document.getElementById('output-section').classList.remove('hidden');
      }
    </script>
  </div>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonli Usullar v2.1 - Jasurbek Haydarov</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');
        body { font-family: 'Roboto Mono', monospace; background-color: #f8fafc; }
        .cyber-header { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .cyber-border { border: 2px solid #000; box-shadow: 6px 6px 0px #000; transition: all 0.2s; }
        .neon-cyan { border-bottom: 4px solid #00f0ff; }
        .bg-magenta { background-color: #ff00ff; }
        .menu-btn {
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
            background: #00f0ff;
            color: #000;
            font-weight: bold;
            padding: 12px 30px;
            border: 2px solid #000;
        }
        .menu-btn:active { transform: translate(2px, 2px); }
    </style>
</head>
<body class="min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div class="w-full md:w-72 bg-white border-r-4 border-black p-6 space-y-8">
            <div>
                <h2 class="text-2xl font-black border-b-4 border-black pb-2 italic uppercase">MENU</h2>
                <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest">Sonli Usullar Tizimi</p>
            </div>
            
            <nav class="space-y-3">
                <button class="w-full text-left p-4 bg-magenta text-white font-bold text-sm uppercase cyber-border italic">Asosiy sahifa</button>
                <button class="w-full text-left p-4 bg-white hover:bg-gray-100 font-bold text-sm uppercase border-2 border-black italic">Funksiya kesishish</button>
                <button class="w-full text-left p-4 bg-white hover:bg-gray-100 font-bold text-sm uppercase border-2 border-black italic">Iteratsiya usuli</button>
                <button class="w-full text-left p-4 bg-white hover:bg-gray-100 font-bold text-sm uppercase border-2 border-black italic leading-tight">Kesmani teng bo'lish</button>
            </nav>
        </div>

        <main class="flex-1 p-6 md:p-12 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <div class="text-center mb-12">
                    <h1 class="cyber-header text-5xl font-black text-black">SONLI USULLAR v2.1</h1>
                    <div class="flex justify-center gap-4 mt-2">
                        <span class="text-[10px] bg-black text-[#00f0ff] px-3 py-1 font-bold uppercase">QarDU 2026</span>
                        <span class="text-[10px] bg-black text-white px-3 py-1 font-bold uppercase italic">Haydarov Jasurbek</span>
                    </div>
                    <div class="neon-cyan w-full mt-6"></div>
                </div>

                <div class="grid grid-cols-1 gap-10">
                    <div class="bg-white p-8 cyber-border relative">
                        <div class="absolute -top-4 left-6 bg-black text-white px-4 py-1 text-xs font-bold italic uppercase tracking-tighter">
                            Inputs / Funksiya Kiritish
                        </div>
                        
                        <div class="space-y-6 mt-4">
                            <div>
                                <label class="block text-sm font-black mb-2 uppercase italic underline decoration-cyan-400 decoration-4">Funksiyani yozing:</label>
                                <input type="text" id="funcInput" placeholder="x^3 + sqrt(x) - sin(x)" 
                                       class="w-full p-4 border-4 border-black focus:outline-none bg-yellow-50 font-mono text-lg"
                                       oninput="updatePreview()">
                                <p class="text-[10px] mt-2 text-gray-500">Masalan: <code class="bg-gray-200 p-1">x^2 - log(x) + cos(x)</code></p>
                            </div>

                            <div class="p-6 bg-gray-900 border-4 border-black text-white flex flex-col items-center justify-center min-h-[120px] shadow-[inset_0_2px_10px_rgba(0,0,0,1)]">
                                <span class="text-[10px] text-cyan-400 mb-2 self-start font-mono uppercase tracking-widest">[ KaTeX Render ]</span>
                                <div id="mathPreview" class="text-3xl"></div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                <div class="border-2 border-black p-3">
                                    <label class="block text-xs font-black uppercase italic">Boshlanish (a):</label>
                                    <input type="number" id="startVal" value="-10" class="w-full bg-transparent font-bold text-xl outline-none">
                                </div>
                                <div class="border-2 border-black p-3">
                                    <label class="block text-xs font-black uppercase italic">Tugash (b):</label>
                                    <input type="number" id="endVal" value="10" class="w-full bg-transparent font-bold text-xl outline-none">
                                </div>
                            </div>

                            <button onclick="calculate()" class="menu-btn w-full text-xl uppercase tracking-tighter hover:bg-black hover:text-cyan-400 transition-colors">
                                Hisoblashni Boshlash →
                            </button>
                        </div>
                    </div>

                    <div id="resultContainer" class="hidden bg-white p-8 cyber-border relative">
                        <div class="absolute -top-4 left-6 bg-magenta text-white px-4 py-1 text-xs font-bold italic uppercase">
                            Analysis / Natijalar
                        </div>
                        <div id="resultOutput" class="space-y-4 pt-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Foydalanuvchi yozgan oddiy matnni KaTeX (LaTeX) formatiga o'tkazish
        function textToLaTeX(text) {
            if (!text) return "...";
            return text
                .replace(/\s+/g, '') // bo'shliqlarni olib tashlash
                .replace(/sqrt\(([^)]+)\)/g, '\\sqrt{$1}') // sqrt(x) -> \sqrt{x}
                .replace(/sin\(([^)]+)\)/g, '\\sin($1)')   // sin(x) -> \sin(x)
                .replace(/cos\(([^)]+)\)/g, '\\cos($1)')
                .replace(/tan\(([^)]+)\)/g, '\\tan($1)')
                .replace(/log\(([^)]+)\)/g, '\\log_{10}($1)')
                .replace(/ln\(([^)]+)\)/g, '\\ln($1)')
                .replace(/\^([\w\d]+)/g, '^{$1}')          // x^2 -> x^{2}
                .replace(/\^\{([^}]+)\}/g, '^{$1}')        // x^{22} bo'lsa tegilmaydi
                .replace(/\*/g, '\\cdot ');                // * -> ko'paytirish nuqtasi
        }

        function updatePreview() {
            const input = document.getElementById('funcInput').value;
            const preview = document.getElementById('mathPreview');
            const latex = textToLaTeX(input);

            try {
                katex.render("f(x) = " + latex, preview, { 
                    throwOnError: false,
                    displayMode: true
                });
            } catch (e) {
                preview.innerHTML = "???";
            }
        }

        function calculate() {
            const input = document.getElementById('funcInput').value;
            const start = parseFloat(document.getElementById('startVal').value);
            const end = parseFloat(document.getElementById('endVal').value);
            const step = 0.5;
            const output = document.getElementById('resultOutput');
            const container = document.getElementById('resultContainer');
            
            container.classList.remove('hidden');
            output.innerHTML = '<h3 class="font-black text-lg border-b-2 border-black pb-2 mb-4 italic uppercase">Ildiz mavjud oraliqlar:</h3>';
            
            // JS Math funksiyalariga o'tkazish (masalan: log -> Math.log10)
            let jsFunc = input.toLowerCase()
                             .replace(/\^/g, '**')
                             .replace(/sqrt/g, 'Math.sqrt')
                             .replace(/sin/g, 'Math.sin')
                             .replace(/cos/g, 'Math.cos')
                             .replace(/tan/g, 'Math.tan')
                             .replace(/log/g, 'Math.log10')
                             .replace(/ln/g, 'Math.log');

            const f = (x) => {
                try {
                    return new Function('x', `return ${jsFunc}`)(x);
                } catch (e) { return NaN; }
            };

            let found = false;
            for (let x = start; x < end; x += step) {
                let x1 = x;
                let x2 = x + step;
                let y1 = f(x1);
                let y2 = f(x2);

                if (y1 * y2 <= 0 && !isNaN(y1) && !isNaN(y2)) {
                    found = true;
                    let div = document.createElement('div');
                    div.className = "p-4 border-l-8 border-cyan-400 bg-gray-50 flex justify-between items-center cyber-border mb-3";
                    div.innerHTML = `
                        <div>
                            <span class="block text-[10px] text-gray-400 font-bold uppercase">Kesishish aniqlandi:</span>
                            <span class="font-black text-xl">[${x1.toFixed(1)} ; ${x2.toFixed(1)}]</span>
                        </div>
                        <div class="text-right text-[10px] font-mono text-gray-500">
                            f(a): ${y1.toFixed(3)}<br>f(b): ${y2.toFixed(3)}
                        </div>
                    `;
                    output.appendChild(div);
                }
            }

            if (!found) {
                output.innerHTML += "<p class='text-red-500 font-bold italic uppercase tracking-tighter'>Hech qanday ildiz topilmadi! Oraliqni yoki funksiyani tekshiring.</p>";
            }
        }

        // Sahifa yuklanganda preview ni bir marta ishga tushirish
        window.onload = updatePreview;
    </script>
</body>
</html>

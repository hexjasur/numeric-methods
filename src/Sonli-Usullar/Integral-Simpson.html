      <script>
        // Inline KaTeX rendering for static elements
        document.querySelectorAll('.tex-inline').forEach(el => {
          katex.render(el.textContent, el, { throwOnError: false });
        });

        // Sakura Petals Generator
        function createPetals() {
          const container = document.getElementById('petals-container');
          const petalCount = 20;

          for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal text-sakura-200 drop-shadow-sm';

            // SVG Petal path
            petal.innerHTML = `<svg width="18" height="18" viewBox="0 0 100 100" fill="currentColor"><path d="M50 0 C 70 30, 90 70, 50 100 C 10 70, 30 30, 50 0" /></svg>`;

            // Randomize properties
            const left = Math.random() * 100;
            const duration = 12 + Math.random() * 18; // Slow fall 12-30s
            const delay = Math.random() * 15;
            const size = 0.4 + Math.random() * 0.8;
            const opacity = 0.4 + Math.random() * 0.4;

            petal.style.left = `${left}%`;
            petal.style.animationDuration = `${duration}s`;
            petal.style.animationDelay = `${delay}s`;
            petal.style.transform = `scale(${size})`;
            petal.style.opacity = opacity;

            container.appendChild(petal);
          }
        }

        // Live Preview Updater
        function updateLivePreview() {
          const expr = document.getElementById('func-input').value || '0';
          const a = document.getElementById('input-a').value || 'a';
          const b = document.getElementById('input-b').value || 'b';

          try {
            const node = math.parse(expr);
            let texExpr = node.toTex();
            // \cdot larni olib tashlaymiz
            texExpr = texExpr.replace(/\\cdot/g, '');

            const integralTex = `\\int_{${a}}^{${b}} ${texExpr}`;
            katex.render(integralTex, document.getElementById('live-integral-preview'), { displayMode: true, throwOnError: false });
          } catch (err) {
            document.getElementById('live-integral-preview').innerHTML = `<span class="text-red-500 text-xs text-center block mt-2">Ifoda xato: ${err.message}</span>`;
          }
        }

        // Utility: Format Number to 5 decimal places cleanly
        const fmt = (num) => Number(num).toFixed(5).replace(/\.?0+$/, '');
        const fmtFixed = (num) => Number(num).toFixed(5);

        // Utility: Show Toast
        function showToast(msg) {
          const toast = document.getElementById('toast');
          const toastMsg = document.getElementById('toast-message');
          toastMsg.innerText = msg;

          toast.classList.remove('hidden', 'toast-exit');
          toast.classList.add('toast-enter');

          setTimeout(() => {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => toast.classList.add('hidden'), 400);
          }, 4000);
        }

        // Main Calculation
        document.getElementById('calc-form').addEventListener('submit', function (e) {
          e.preventDefault();

          const exprStr = document.getElementById('func-input').value;
          const a = parseFloat(document.getElementById('input-a').value);
          const b = parseFloat(document.getElementById('input-b').value);
          let n = parseInt(document.getElementById('input-n').value);

          if (n <= 0) {
            showToast("Bo'linishlar soni musbat bo'lishi kerak.");
            return;
          }

          if (n % 2 !== 0) {
            showToast("Bo'linishlar soni 'n' juft bo'lishi kerak. Avtomatik ravishda juftlandi (+1).");
            n = n + 1;
            document.getElementById('input-n').value = n;
          }

          if (a >= b) {
            showToast("Quyi chegara (a) yuqori chegaradan (b) qat'iy kichik bo'lishi kerak.");
            return;
          }

          let compiled;
          try {
            compiled = math.compile(exprStr);
          } catch (err) {
            showToast("Funksiya ifodasi xato kiritilgan!");
            return;
          }

          // dx yozilganda 1 deb hisoblab ketamiz
          const f = (val) => compiled.evaluate({ x: val, dx: 1 });

          const h = (b - a) / n;

          // Render UI containers
          document.getElementById('empty-state').classList.add('hidden');
          const resultsContainer = document.getElementById('results-container');
          resultsContainer.classList.remove('hidden');
          // Small opacity transition effect
          resultsContainer.style.opacity = 0;
          setTimeout(() => resultsContainer.style.opacity = 1, 50);

          const tbody = document.getElementById('table-body');
          tbody.innerHTML = '';

          let sumEven = 0;
          let sumOdd = 0;
          const yVals = [];

          // Build Table and Calculate
          for (let i = 0; i <= n; i++) {
            const x_i = a + i * h;
            const y_i = f(x_i);
            yVals.push(y_i);

            if (i > 0 && i < n) {
              if (i % 2 === 0) sumEven += y_i;
              else sumOdd += y_i;
            }

            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/60 transition-colors duration-200";

            let bgClass = "text-gray-800";
            let dotIndicator = "";

            if (i === 0 || i === n) {
              bgClass = "text-sakura-600 font-bold";
              dotIndicator = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-sakura-400 mr-2"></span>`;
            } else if (i % 2 !== 0) {
              bgClass = "text-sky-700 font-medium";
            } else {
              bgClass = "text-amber-700 font-medium";
            }

            tr.innerHTML = `
                    <td class="px-5 py-3 text-center border-r border-sakura-200/40 text-gray-500 bg-white/20">${i}</td>
                    <td class="px-5 py-3">${fmtFixed(x_i)}</td>
                    <td class="px-5 py-3 ${bgClass} flex items-center">${dotIndicator}${fmtFixed(y_i)}</td>
                `;
            tbody.appendChild(tr);
          }

          const endsSum = yVals[0] + yVals[n];
          const simpsonIntegral = (h / 3) * (endsSum + 4 * sumOdd + 2 * sumEven);

          // Yuqori aniqlikdagi integral (Kutilayotgan "Aniq" qiymat sifatida Simpson n=10000)
          let exactIntegral = 0;
          const n_exact = 10000;
          const h_exact = (b - a) / n_exact;
          let sumE_exact = 0;
          let sumO_exact = 0;
          for (let i = 1; i < n_exact; i++) {
            const x_i = a + i * h_exact;
            const y_i = f(x_i);
            if (i % 2 === 0) sumE_exact += y_i;
            else sumO_exact += y_i;
          }
          exactIntegral = (h_exact / 3) * (f(a) + f(b) + 4 * sumO_exact + 2 * sumE_exact);
          const errorMargin = Math.abs(simpsonIntegral - exactIntegral);

          // ---- Render Math Steps with KaTeX ----

          // Step 1: h
          const texStep1 = `h = \\frac{b-a}{n} = \\frac{${fmt(b)} - ${fmt(a)}}{${n}} = ${fmtFixed(h)}`;
          katex.render(texStep1, document.getElementById('math-step-1'), { displayMode: true, throwOnError: false });

          // Step 2: Sums
          const texStep2 = `
                \\begin{aligned}
                Y_{chet} &= y_0 + y_n = ${fmtFixed(endsSum)} \\\\
                \\sum Y_{toq} &= y_1 + y_3 + \\dots = ${fmtFixed(sumOdd)} \\\\
                \\sum Y_{juft} &= y_2 + y_4 + \\dots = ${fmtFixed(sumEven)}
                \\end{aligned}
            `;
          katex.render(texStep2, document.getElementById('math-step-2'), { displayMode: true, throwOnError: false });

          // Step 3: Simpson
          const texStep3 = `
                \\begin{aligned}
                I &\\approx \\frac{h}{3} \\Big[ Y_{chet} + 4\\sum Y_{toq} + 2\\sum Y_{juft} \\Big] \\\\
                I &\\approx \\frac{${fmtFixed(h)}}{3} \\Big[ ${fmtFixed(endsSum)} + 4(${fmtFixed(sumOdd)}) + 2(${fmtFixed(sumEven)}) \\Big] \\\\
                I &\\approx \\mathbf{${fmtFixed(simpsonIntegral)}}
                \\end{aligned}
            `;
          katex.render(texStep3, document.getElementById('math-step-3'), { displayMode: true, throwOnError: false });

          // Step 4: Newton-Leibniz
          // Formatting scientific notation for KaTeX
          const [errMantissa, errExponent] = errorMargin.toExponential(4).split('e');
          const texError = `${errMantissa} \\times 10^{${errExponent}}`;

          let texExprStr = '';
          try { texExprStr = math.parse(exprStr).toTex().replace(/\\cdot/g, ''); } catch (e) { texExprStr = 'f(x)dx'; }

          const texStep4 = `
                \\begin{aligned}
                I_{aniq} &\\approx \\int_{${fmt(a)}}^{${fmt(b)}} ${texExprStr} \\approx ${fmtFixed(exactIntegral)} \\text{ (n=10000)} \\\\
                \\Delta &= |I - I_{aniq}| = \\mathbf{${texError}}
                \\end{aligned}
            `;
          katex.render(texStep4, document.getElementById('math-step-4'), { displayMode: true, throwOnError: false });

          // Smooth scroll to results on smaller screens
          if (window.innerWidth < 1024) {
            setTimeout(() => {
              resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
          }
        });

        // Initialize UI
        document.addEventListener('DOMContentLoaded', () => {
          createPetals();
          updateLivePreview();

          document.getElementById('func-input').addEventListener('input', updateLivePreview);
          document.getElementById('input-a').addEventListener('input', updateLivePreview);
          document.getElementById('input-b').addEventListener('input', updateLivePreview);
        });
      </script>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChATS Iteratsiya x5 - KarDU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code&display=swap');
        body { background-color: #f8fafc; font-family: 'Fira Code', monospace; color: #1e293b; }
        .cyber-header { border: 2px solid #000; padding: 20px; text-align: center; margin-bottom: 20px; background: white; }
        .cyber-card { border: 1px solid #e2e8f0; background: white; border-radius: 4px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .input-box { border: 1px solid #000; width: 55px; height: 35px; text-align: center; font-size: 12px; font-weight: bold; }
        .btn-black { background: #000; color: #fff; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .btn-black:hover { background: #333; }
        .label-tag { background: #00d4ff; color: #000; font-size: 10px; padding: 2px 8px; font-weight: bold; }
        .step-box { background: #f1f5f9; border-left: 4px solid #00d4ff; padding: 10px; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <div class="cyber-header">
            <h1 class="text-3xl font-bold orbitron uppercase tracking-widest">ODDIY ITERATSIYA <span class="text-cyan-500">x5 TIZIM</span></h1>
            <p class="text-xs text-gray-500 mt-2">5 NOMA'LUMLI CHIZIQLI ALGEBRAIK TENGLAMALAR SISTEMASI</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 space-y-6">
                <div class="cyber-card p-6">
                    <div class="flex items-center gap-2 mb-6">
                        <span class="label-tag">INPUT SYSTEM</span>
                        <h2 class="font-bold uppercase text-sm">Tenglamalar Koeffitsientlari</h2>
                    </div>

                    <div id="matrix-container" class="space-y-3 overflow-x-auto">
                        </div>
                </div>

                <div id="steps-container" class="cyber-card p-6 hidden">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="label-tag">CALCULATION STEPS</span>
                        <h2 class="font-bold uppercase text-sm">Har bir iteratsiya hisoblanishi</h2>
                    </div>
                    <div id="steps-list" class="max-h-[500px] overflow-y-auto space-y-4 pr-2"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="cyber-card p-6">
                    <span class="label-tag mb-4 block w-fit">SOZLAMALAR</span>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold block mb-1">EPSILON (&epsilon;):</label>
                            <input type="number" id="eps" value="0.001" step="0.0001" class="w-full border border-black p-2 font-bold text-center">
                        </div>
                        <button onclick="runCalculations()" class="w-full py-4 btn-black font-bold">HISOBLASH</button>
                    </div>
                </div>

                <div class="cyber-card p-6">
                    <span class="label-tag mb-4 block w-fit">YAQINLASHISH SHARTI</span>
                    <div id="shart-output" class="text-[11px] space-y-1"></div>
                </div>
            </div>
        </div>

        <div id="table-section" class="mt-8 cyber-card p-6 hidden">
            <h3 class="font-bold mb-4 uppercase text-sm">Natijalar jadvali</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-[12px] text-center border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b-2 border-black">
                            <th class="p-2">k</th>
                            <th class="p-2">x₁</th>
                            <th class="p-2">x₂</th>
                            <th class="p-2">x₃</th>
                            <th class="p-2">x₄</th>
                            <th class="p-2">x₅</th>
                            <th class="p-2">max|&Delta;|</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // User bergan default qiymatlar
        const defaultValues = [
            [10, 1, -3, -2, 1, 6],
            [-1, 25, 1, -5, -2, 11],
            [2, 1, -20, 2, -3, -19],
            [0, 1, -1, 10, -5, 10],
            [1, 2, 1, 2, -20, -32]
        ];

        function init() {
            const container = document.getElementById('matrix-container');
            for(let i=0; i<5; i++) {
                let row = document.createElement('div');
                row.className = "flex items-center gap-1 min-w-max";
                row.innerHTML = `<span class="text-xs w-4">${i+1}.</span>`;
                for(let j=0; j<5; j++) {
                    row.innerHTML += `
                        <input type="number" id="a${i}${j}" value="${defaultValues[i][j]}" class="input-box">
                        <span class="text-[10px] mr-1">x${j+1} ${j<4 ? '+' : '='}</span>`;
                }
                row.innerHTML += `<input type="number" id="b${i}" value="${defaultValues[i][5]}" class="input-box">`;
                container.appendChild(row);
            }
        }

        function runCalculations() {
            const a = [], b = [];
            for(let i=0; i<5; i++) {
                a[i] = [];
                for(let j=0; j<5; j++) {
                    let val = document.getElementById(`a${i}${j}`).value;
                    a[i][j] = val === "" ? 0 : parseFloat(val);
                }
                let bVal = document.getElementById(`b${i}`).value;
                b[i] = bVal === "" ? 0 : parseFloat(bVal);
            }
            const eps = parseFloat(document.getElementById('eps').value);

            // 1. Shart tekshiruvi
            let shartHtml = "";
            for(let i=0; i<5; i++) {
                let sum = 0;
                for(let j=0; j<5; j++) if(i!==j) sum += Math.abs(a[i][j]);
                let diag = Math.abs(a[i][i]);
                shartHtml += `<div class="${diag > sum ? 'text-green-600' : 'text-red-500'}">
                    Qator ${i+1}: |${diag}| > ${sum.toFixed(1)} ${diag > sum ? '✅' : '❌'}
                </div>`;
            }
            document.getElementById('shart-output').innerHTML = shartHtml;

            // 2. Iteratsiya boshlandi
            let x = b.map((val, i) => val / a[i][i]); // x(0)
            let iterations = [{ k: 0, x: [...x], delta: 0 }];
            let stepsHtml = "";

            let k = 1;
            let converged = false;
            while(k <= 30 && !converged) {
                let nextX = [];
                let stepDetails = `<div class="step-box"><b>Iteratsiya k=${k}:</b><br>`;
                
                for(let i=0; i<5; i++) {
                    let sumStr = "";
                    let sumVal = 0;
                    for(let j=0; j<5; j++) {
                        if(i !== j) {
                            sumVal += a[i][j] * x[j];
                            sumStr += ` - (${a[i][j]})(${x[j].toFixed(4)})`;
                        }
                    }
                    nextX[i] = (b[i] - sumVal) / a[i][i];
                    stepDetails += `x${i+1} = (${b[i]}${sumStr}) / ${a[i][i]} = <b>${nextX[i].toFixed(5)}</b><br>`;
                }

                let delta = Math.max(...nextX.map((v, i) => Math.abs(v - x[i])));
                stepDetails += `<span class="text-cyan-600">max|&Delta;| = ${delta.toFixed(6)}</span></div>`;
                stepsHtml += stepDetails;

                iterations.push({ k: k, x: [...nextX], delta: delta });
                if(delta < eps) converged = true;
                x = [...nextX];
                k++;
            }

            // 3. UI yangilash
            document.getElementById('steps-list').innerHTML = stepsHtml;
            document.getElementById('steps-container').classList.remove('hidden');
            
            let tableBody = document.getElementById('table-body');
            tableBody.innerHTML = iterations.map(row => `
                <tr class="border-b border-gray-100">
                    <td class="p-2 font-bold">${row.k}</td>
                    ${row.x.map(v => `<td class="p-2">${v.toFixed(5)}</td>`).join('')}
                    <td class="p-2 font-bold ${row.delta < eps && row.k>0 ? 'text-green-600' : 'text-red-500'}">
                        ${row.k === 0 ? '-' : row.delta.toFixed(6)}
                    </td>
                </tr>
            `).join('');
            document.getElementById('table-section').classList.remove('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>

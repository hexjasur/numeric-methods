  <!-- 11. SPLASH SCREEN & LOADING STATE (INLINED TO PREVENT FOUC) -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->

  <style>
    /* Splash screen prevents Flash Of Unstyled Content (FOUC) */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #app-splash.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    .splash-title {
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #0f172a;
    }

    .splash-subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .splash-ring {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-ring::before {
      content: '';
      position: absolute;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #00f2ff;
      border-right-color: #00f2ff;
      animation: splash-spin 1.2s linear infinite;
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

[package]
name = "numeric-methods"
version = "3.0.0"
description = "Numeric Methods desktop and mobile application"
authors = ["Numeric Methods"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "numeric_methods_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
